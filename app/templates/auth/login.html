{% extends "base.html" %}

{% block title %}Sign In{% endblock %}

{% block auth_content %}
<div class="card" style="padding: 2.25rem; border: 1px solid var(--border-color); box-shadow: var(--shadow-lg); background: var(--bg-card);">
  <div style="text-align: center; margin-bottom: 2rem;">
    <div style="display: inline-flex; align-items: center; justify-content: center; width: 56px; height: 56px; background: linear-gradient(135deg, rgba(198, 138, 76, 0.25), rgba(198, 138, 76, 0.05)); border: 1px solid var(--primary-border); border-radius: var(--radius-md); margin-bottom: 1rem; color: var(--primary);">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
        <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
        <line x1="6" y1="1" x2="6" y2="4"></line>
        <line x1="10" y1="1" x2="10" y2="4"></line>
        <line x1="14" y1="1" x2="14" y2="4"></line>
      </svg>
    </div>
    <h1 style="font-size: 1.45rem; margin-bottom: 0.35rem; letter-spacing: -0.02em;">{{ store_name }}</h1>
    <p style="font-size: 0.86rem; color: var(--text-dim); margin-bottom: 0;">Internal Management & Operations Portal</p>
  </div>

  <form method="POST" action="{{ url_for('auth.login') }}" id="loginForm">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

    <div class="form-group">
      <label class="form-label" for="username">Username or Staff Email</label>
      <input type="text" id="username" name="username" class="form-control" placeholder="e.g. owner or manager" required autofocus autocomplete="username">
    </div>

    <div class="form-group">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
        <label class="form-label" for="password" style="margin-bottom: 0;">Password</label>
      </div>
      <div style="position: relative;">
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••••••" required autocomplete="current-password" style="padding-right: 42px;">
        <button type="button" id="togglePasswordBtn" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-dim); cursor: pointer; padding: 4px; display: flex;" aria-label="Toggle password visibility">
          <svg id="eyeIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>
    </div>

    <div class="form-group" style="display: flex; align-items: center; justify-content: space-between; margin-bottom: 1.5rem;">
      <label class="form-check">
        <input type="checkbox" name="remember" value="1">
        <span style="font-size: 0.82rem; color: var(--text-muted);">Remember this device</span>
      </label>
    </div>

    <button type="submit" class="btn btn-primary btn-block btn-lg" id="submitBtn">Sign In to Dashboard</button>
  </form>

  <div style="margin-top: 1.75rem; padding-top: 1.25rem; border-top: 1px solid var(--border-color); font-size: 0.8rem;">
    <div style="font-weight: 600; color: var(--text-muted); margin-bottom: 0.2rem; text-align: center;">Demo Staff Accounts</div>
    <div style="font-size: 0.74rem; color: var(--text-dim); text-align: center; margin-bottom: 0.85rem;">Click any role to auto-populate credentials:</div>
    
    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem;">
      <button type="button" class="btn demo-fill-btn" data-user="owner" data-pwd="OwnerPass123!" style="display: flex; flex-direction: column; align-items: flex-start; gap: 0.2rem; padding: 0.55rem 0.75rem; border: 1px solid var(--border-color); background: var(--bg-subtle); cursor: pointer; border-radius: var(--radius-sm); text-align: left; transition: all 0.15s ease;">
        <span class="badge badge-primary" style="font-size: 0.68rem; padding: 0.15rem 0.45rem;">Owner</span>
        <div style="font-size: 0.76rem; color: var(--text-main); font-family: monospace;">user: <strong>owner</strong></div>
        <div style="font-size: 0.70rem; color: var(--text-dim); font-family: monospace;">pass: OwnerPass123!</div>
      </button>

      <button type="button" class="btn demo-fill-btn" data-user="manager" data-pwd="ManagerPass123!" style="display: flex; flex-direction: column; align-items: flex-start; gap: 0.2rem; padding: 0.55rem 0.75rem; border: 1px solid var(--border-color); background: var(--bg-subtle); cursor: pointer; border-radius: var(--radius-sm); text-align: left; transition: all 0.15s ease;">
        <span class="badge badge-success" style="font-size: 0.68rem; padding: 0.15rem 0.45rem;">Manager</span>
        <div style="font-size: 0.76rem; color: var(--text-main); font-family: monospace;">user: <strong>manager</strong></div>
        <div style="font-size: 0.70rem; color: var(--text-dim); font-family: monospace;">pass: ManagerPass123!</div>
      </button>

      <button type="button" class="btn demo-fill-btn" data-user="cashier" data-pwd="CashierPass123!" style="display: flex; flex-direction: column; align-items: flex-start; gap: 0.2rem; padding: 0.55rem 0.75rem; border: 1px solid var(--border-color); background: var(--bg-subtle); cursor: pointer; border-radius: var(--radius-sm); text-align: left; transition: all 0.15s ease;">
        <span class="badge badge-info" style="font-size: 0.68rem; padding: 0.15rem 0.45rem;">Cashier</span>
        <div style="font-size: 0.76rem; color: var(--text-main); font-family: monospace;">user: <strong>cashier</strong></div>
        <div style="font-size: 0.70rem; color: var(--text-dim); font-family: monospace;">pass: CashierPass123!</div>
      </button>

      <button type="button" class="btn demo-fill-btn" data-user="barista" data-pwd="BaristaPass123!" style="display: flex; flex-direction: column; align-items: flex-start; gap: 0.2rem; padding: 0.55rem 0.75rem; border: 1px solid var(--border-color); background: var(--bg-subtle); cursor: pointer; border-radius: var(--radius-sm); text-align: left; transition: all 0.15s ease;">
        <span class="badge" style="background: rgba(168, 85, 247, 0.12); color: #c084fc; border: 1px solid rgba(168, 85, 247, 0.25); font-size: 0.68rem; padding: 0.15rem 0.45rem;">Barista</span>
        <div style="font-size: 0.76rem; color: var(--text-main); font-family: monospace;">user: <strong>barista</strong></div>
        <div style="font-size: 0.70rem; color: var(--text-dim); font-family: monospace;">pass: BaristaPass123!</div>
      </button>

      <button type="button" class="btn demo-fill-btn" data-user="staff" data-pwd="StaffPass123!" style="grid-column: span 2; display: flex; flex-direction: row; justify-content: space-between; align-items: center; padding: 0.55rem 0.75rem; border: 1px solid var(--border-color); background: var(--bg-subtle); cursor: pointer; border-radius: var(--radius-sm); text-align: left; transition: all 0.15s ease;">
        <span class="badge badge-secondary" style="font-size: 0.68rem; padding: 0.15rem 0.45rem;">Staff</span>
        <div style="display: flex; gap: 1rem; font-family: monospace; font-size: 0.74rem;">
          <span style="color: var(--text-main);">user: <strong>staff</strong></span>
          <span style="color: var(--text-dim);">pass: StaffPass123!</span>
        </div>
      </button>
    </div>
  </div>
</div>

<script>
  document.addEventListener('DOMContentLoaded', function() {
    const toggleBtn = document.getElementById('togglePasswordBtn');
    const pwdField = document.getElementById('password');
    const userField = document.getElementById('username');

    if (toggleBtn && pwdField) {
      toggleBtn.addEventListener('click', function() {
        const isPassword = pwdField.type === 'password';
        pwdField.type = isPassword ? 'text' : 'password';
        toggleBtn.innerHTML = isPassword 
          ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>'
          : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
      });
    }

    // Auto-fill when clicking any demo credential button
    document.querySelectorAll('.demo-fill-btn').forEach(btn => {
      btn.addEventListener('click', function() {
        const u = this.getAttribute('data-user');
        const p = this.getAttribute('data-pwd');
        if (userField && pwdField) {
          userField.value = u;
          pwdField.value = p;
          userField.style.borderColor = 'var(--primary)';
          pwdField.style.borderColor = 'var(--primary)';
          setTimeout(() => {
            userField.style.borderColor = '';
            pwdField.style.borderColor = '';
          }, 450);
        }
      });
      btn.addEventListener('mouseenter', function() {
        this.style.borderColor = 'var(--primary-border)';
        this.style.background = 'var(--bg-card-hover)';
      });
      btn.addEventListener('mouseleave', function() {
        this.style.borderColor = 'var(--border-color)';
        this.style.background = 'var(--bg-subtle)';
      });
    });
  });
</script>
{% endblock %}
