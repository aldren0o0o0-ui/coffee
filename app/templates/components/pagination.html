{% if pagination and pagination.pages > 1 %}
<div class="pagination-wrapper" style="display: flex; align-items: center; justify-content: space-between; margin-top: 1.5rem; flex-wrap: wrap; gap: 0.75rem;">
  <div style="font-size: 0.85rem; color: var(--text-muted);">
    Showing page <strong style="color: #fff;">{{ pagination.page }}</strong> of <strong style="color: #fff;">{{ pagination.pages }}</strong> ({{ pagination.total }} total records)
  </div>
  <div style="display: flex; gap: 0.4rem;">
    {% if pagination.has_prev %}
      <a href="{{ url_for(request.endpoint, page=pagination.prev_num, **request.args) }}" class="btn btn-secondary btn-sm">&larr; Previous</a>
    {% else %}
      <button class="btn btn-secondary btn-sm" disabled style="opacity: 0.4; cursor: not-allowed;">&larr; Previous</button>
    {% endif %}

    {% if pagination.has_next %}
      <a href="{{ url_for(request.endpoint, page=pagination.next_num, **request.args) }}" class="btn btn-secondary btn-sm">Next &rarr;</a>
    {% else %}
      <button class="btn btn-secondary btn-sm" disabled style="opacity: 0.4; cursor: not-allowed;">Next &rarr;</button>
    {% endif %}
  </div>
</div>
{% endif %}
