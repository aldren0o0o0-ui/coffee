<header class="top-navbar">
  <div style="display: flex; align-items: center; gap: 1rem;">
    <button class="btn btn-secondary btn-sm sidebar-toggle-btn" style="display: none;" id="sidebarToggle"
      aria-label="Toggle navigation">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <line x1="3" y1="12" x2="21" y2="12"></line>
        <line x1="3" y1="6" x2="21" y2="6"></line>
        <line x1="3" y1="18" x2="21" y2="18"></line>
      </svg>
    </button>
    <div
      style="font-weight: 700; font-size: 0.95rem; color: var(--text-main); display: flex; align-items: center; gap: 0.6rem; letter-spacing: -0.01em;">
      <span style="color: var(--primary); display: flex;">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8h1a4 4 0 0 1 0 8h-1"></path>
          <path d="M2 8h16v9a4 4 0 0 1-4 4H6a4 4 0 0 1-4-4V8z"></path>
          <line x1="6" y1="1" x2="6" y2="4"></line>
          <line x1="10" y1="1" x2="10" y2="4"></line>
          <line x1="14" y1="1" x2="14" y2="4"></line>
        </svg>
      </span>
      <span>{{ store_name }}</span>
    </div>
    <span class="badge badge-success" style="font-size: 0.70rem; padding: 0.2rem 0.6rem;">
      <span class="status-dot online"></span>
      Store Operational
    </span>
  </div>

  <div style="display: flex; align-items: center; gap: 1rem;">
    {% if current_user.is_authenticated %}
    <div style="display: flex; align-items: center; gap: 0.75rem;">
      <a href="{{ url_for('auth.profile') }}"
        style="text-decoration: none; display: flex; align-items: center; gap: 0.65rem;" title="View Profile">
        <div
          style="width: 32px; height: 32px; border-radius: var(--radius-sm); background: var(--primary-light); border: 1px solid var(--primary-border); display: flex; align-items: center; justify-content: center; color: var(--accent); font-weight: 700; font-size: 0.85rem;">
          {{ current_user.first_name[0] if current_user.first_name else 'U' }}
        </div>
        <div style="text-align: right; line-height: 1.25;">
          <div style="font-size: 0.86rem; font-weight: 600; color: var(--text-main);">{{ current_user.full_name }}</div>
          <div
            style="font-size: 0.70rem; color: var(--accent); text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600;">
            {{ current_user.role }}</div>
        </div>
      </a>

      <a href="{{ url_for('auth.logout') }}" class="btn btn-outline btn-sm" title="Sign Out">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        <span>Sign Out</span>
      </a>
    </div>
    {% else %}
    <a href="{{ url_for('auth.login') }}" class="btn btn-primary btn-sm">Sign In</a>
    {% endif %}
  </div>
</header>
