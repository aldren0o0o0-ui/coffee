{% extends "base.html" %}

{% block title %}Create User Account{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1>Create Staff Account</h1>
    <p>Provision login credentials and define Role-Based Access Control privileges</p>
  </div>
  <a href="{{ url_for('users.index') }}" class="btn btn-secondary">&larr; Back to Users</a>
</div>

<div style="max-width: 600px;">
  <div class="card">
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="username">Username *</label>
          <input type="text" id="username" name="username" class="form-control" placeholder="e.g. barista_sam" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="role">Role Permission Level *</label>
          <select id="role" name="role" class="form-control form-select" required>
            {% for r in roles %}
              <option value="{{ r }}">{{ r }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="first_name">First Name *</label>
          <input type="text" id="first_name" name="first_name" class="form-control" placeholder="e.g. Samantha" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="last_name">Last Name *</label>
          <input type="text" id="last_name" name="last_name" class="form-control" placeholder="e.g. Hayes" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address *</label>
        <input type="email" id="email" name="email" class="form-control" placeholder="sam@coffee-shop.local" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Password *</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="Minimum 8 characters with numbers" required>
      </div>

      <div class="form-group">
        <label class="form-check">
          <input type="checkbox" name="is_active" value="1" checked>
          <span style="color: #fff; font-weight: 500;">Account is active and permitted to sign in</span>
        </label>
      </div>

      <div style="display: flex; gap: 0.75rem; margin-top: 1.5rem;">
        <button type="submit" class="btn btn-primary">Create Account</button>
        <a href="{{ url_for('users.index') }}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
