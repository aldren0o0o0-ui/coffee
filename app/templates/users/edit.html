{% extends "base.html" %}

{% block title %}Edit Staff Account - {{ user.username }}{% endblock %}

{% block content %}
<div class="page-header">
  <div>
    <h1>Edit Account: {{ user.username }}</h1>
    <p>Update role permissions, personal info, or reset password</p>
  </div>
  <a href="{{ url_for('users.index') }}" class="btn btn-secondary">&larr; Back to Users</a>
</div>

<div style="max-width: 600px;">
  <div class="card">
    <form method="POST">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Username</label>
          <input type="text" class="form-control" value="{{ user.username }}" disabled style="opacity: 0.7;">
        </div>

        <div class="form-group">
          <label class="form-label" for="role">Role Permission Level *</label>
          <select id="role" name="role" class="form-control form-select" required>
            {% for r in roles %}
              <option value="{{ r }}" {% if user.role == r %}selected{% endif %}>{{ r }}</option>
            {% endfor %}
          </select>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label" for="first_name">First Name *</label>
          <input type="text" id="first_name" name="first_name" class="form-control" value="{{ user.first_name }}" required>
        </div>

        <div class="form-group">
          <label class="form-label" for="last_name">Last Name *</label>
          <input type="text" id="last_name" name="last_name" class="form-control" value="{{ user.last_name }}" required>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="email">Email Address *</label>
        <input type="email" id="email" name="email" class="form-control" value="{{ user.email }}" required>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Reset Password (Leave blank to keep unchanged)</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="New password...">
      </div>

      <div class="form-group">
        <label class="form-check">
          <input type="checkbox" name="is_active" value="1" {% if user.is_active %}checked{% endif %}>
          <span style="color: #fff; font-weight: 500;">Account is active and permitted to sign in</span>
        </label>
      </div>

      <div style="display: flex; gap: 0.75rem; margin-top: 1.5rem;">
        <button type="submit" class="btn btn-primary">Save Changes</button>
        <a href="{{ url_for('users.index') }}" class="btn btn-secondary">Cancel</a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
