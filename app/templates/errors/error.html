{% extends "base.html" %}

{% block title %}Application Error ({{ error_code }}){% endblock %}

{% block content %}
<div class="empty-state" style="margin-top: 3rem;">
  <div style="font-size: 3.5rem; color: #ffb74d;">☕</div>
  <h1 style="font-size: 1.8rem; margin: 0.5rem 0;">{{ error_code }} - Notice</h1>
  <p style="margin-bottom: 1.5rem; font-size: 1.05rem; color: #fff;">{{ message }}</p>
  <a href="{{ url_for('dashboard.index') }}" class="btn btn-primary">&larr; Return to Dashboard</a>
</div>
{% endblock %}
